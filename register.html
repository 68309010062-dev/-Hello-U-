<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello U - Register</title>
    <link rel="icon" type="image/png" href="https://cdn.phototourl.com/free/2026-07-02-bf2530e4-cb2e-459f-93de-d59034eb5c2c.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page"> 
    <div class="container">
        <div class="logo">Hello U</div>
        <h1>ลงทะเบียนสมาชิกใหม่</h1>
        <p>กรอกข้อมูลของคุณเพื่อสร้างบัญชีผู้ใช้</p>
        
        <form id="registerForm">
            <input type="text" id="regName" placeholder="ชื่อ-นามสกุล หรือ ชื่อเล่น..." required>
            <input type="email" id="regEmail" placeholder="อีเมลของคุณ (เช่น name@gmail.com)..." required>
            <input type="password" id="regPassword" placeholder="ตั้งรหัสผ่าน (อย่างน้อย 6 ตัว)..." required>
            <input type="password" id="regPasswordConfirm" placeholder="ยืนยันรหัสผ่านอีกครั้ง..." required>
            
            <!-- ➕ เลือกสิทธิ์การใช้งาน (Role) -->
            <div class="role-selection">
    <label for="regRole">ประเภทบัญชีผู้ใช้:</label>
    <select id="regRole" required>
        <option value="user">👤 ผู้ใช้ทั่วไป (User)</option>
        <option value="admin">🛡️ ผู้ดูแลระบบ (Admin)</option>
        <!-- นำตัวเลือก Super Admin ออกจากตรงนี้ -->
    </select>
</div>

            <!-- 🪪 ข้อมูลเพิ่มเติมสำหรับ Admin / Super Admin -->
            <div id="adminKeyGroup" style="display: none; margin-top: 10px;">
                <input type="text" id="adminOfficerId" placeholder="🪪 ใส่รหัสเจ้าหน้าที่ (Officer ID)...">
                <input type="password" id="adminKey" placeholder="🔑 ใส่ Admin Key ยืนยันสิทธิ์...">
                <small id="attemptWarning" style="color: #ef4444; display: block; margin-top: 4px; font-size: 12px;"></small>
            </div>

            <button type="submit" id="submitRegBtn" class="btn" style="margin-top: 15px;">📝 บันทึกข้อมูลลงทะเบียน</button>
        </form>

        <p class="link-text">เป็นสมาชิกอยู่แล้ว? <a href="index.html">กลับไปหน้าเข้าสู่ระบบ</a></p>
    </div>

    <script type="module" src="auth.js"></script>
</body>
</html>
