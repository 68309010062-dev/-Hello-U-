<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello U - เว็บไซต์เก็บสะสมผลงาน</title>
    
    <!-- 🌟 Favicon -->
    <link rel="icon" type="image/png" href="https://cdn.phototourl.com/free/2026-07-02-bf2530e4-cb2e-459f-93de-d59034eb5c2c.png">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">

    <div class="container theme-blue">
        <!-- 🔔 กล่องแสดงข้อความแจ้งเตือนสถานะการอนุมัติ (ค้างไว้บนสุดเสมอ) -->
        <div id="statusAlertBox" style="display: none; padding: 14px 16px; border-radius: 12px; font-size: 0.9rem; margin-bottom: 20px; text-align: left; line-height: 1.5; font-weight: 500; position: relative;"></div>

        <div class="logo-container">
            <img src="https://cdn.phototourl.com/free/2026-07-02-bf2530e4-cb2e-459f-93de-d59034eb5c2c.png" class="logo-image" alt="Hello U Logo">
        </div>

        <h1>เข้าสู่ระบบ</h1>
        <p>ยินดีต้อนรับกลับมา! กรุณากรอกข้อมูลเพื่อเข้าใช้งาน</p>

        <form id="loginForm">
            <input type="email" id="loginEmail" placeholder="พิมพ์อีเมลของคุณ..." required>
            <input type="password" id="loginPassword" placeholder="พิมพ์รหัสผ่าน..." required>
            
            <button type="submit" class="btn">🚀 กดเพื่อเข้าสู่ระบบ</button>
            
            <button type="button" id="googleLoginBtn" class="btn btn-google">
                <img class="google-icon" src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/web-24dp/logo_googleg_color_1x_web_24dp.png" alt="Google Icon">
                เข้าสู่ระบบด้วย Google
            </button>
        </form>

        <p class="link-text">ยังไม่มีบัญชี? <a href="register.html">ลงทะเบียนที่นี่</a></p>
    </div>

    <script type="module" src="auth.js"></script>
</body>
</html>
