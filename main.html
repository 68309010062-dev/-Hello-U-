<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hello U - หน้าหลักสะสมผลงาน</title>
    <!-- Favicon & Stylesheets -->
    <link rel="icon" type="image/png" href="https://cdn.phototourl.com/free/2026-07-02-bf2530e4-cb2e-459f-93de-d59034eb5c2c.png">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="main-page">

    <!-- ⬛ ฉากหลังโปร่งแสงสำหรับมือถือ -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div class="dashboard-wrapper">
        
        <!-- 🧭 แท็บเมนูด้านข้าง (Sidebar Menu) -->
        <aside id="sidebar" class="sidebar">
            <button type="button" id="menuToggleBtn" class="arrow-toggle-btn" title="เปิด/ปิด เมนู" aria-label="Toggle Navigation">
                <i id="toggleIcon" class="fa-solid fa-chevron-left"></i>
            </button>

            <div>
                <!-- โลโก้แบรนด์ (เปลี่ยนจากไอคอนโฟลเดอร์เป็นรูปภาพ) -->
                <div class="sidebar-brand">
                    <img src="https://cdn.phototourl.com/free/2026-07-02-bf2530e4-cb2e-459f-93de-d59034eb5c2c.png" alt="Hello U Logo" class="brand-icon" style="width: 32px; height: 32px; object-fit: contain;">
                    <span class="brand-text">Hello U</span>
                </div>
                
                <!-- 📂 แท็บเมนูหลัก -->
                <nav class="sidebar-menu">
                    <a href="main.html" class="menu-item active">
                        <i class="fa-solid fa-house"></i>
                        <span class="menu-text">หน้าหลัก</span>
                    </a>
                    <a href="history.html" class="menu-item">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                        <span class="menu-text">ประวัติผลงาน</span>
                    </a>
                </nav>
            </div>

            <!-- ส่วนข้อมูลผู้ใช้และปุ่มตั้งค่าด้านล่าง -->
            <div class="sidebar-footer">
                <div class="user-info-box">
                    <div class="avatar-box">
                        <img id="userAvatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=HelloU" alt="User Avatar">
                    </div>
                    <div class="user-meta">
                        <p id="userNameDisplay">กำลังโหลด...</p>
                        <p id="portfolioCountDisplay">จำนวนผลงาน: 0 ชิ้น</p>
                    </div>
                </div>
                
                <button type="button" id="settingsBtn" class="settings-btn" title="ตั้งค่าโปรไฟล์">
                    <i class="fa-solid fa-gear"></i>
                    <span class="menu-text">ตั้งค่าโปรไฟล์</span>
                </button>
            </div>
        </aside>

        <!-- 📄 เนื้อหาหลักฝั่งขวา -->
        <main class="main-content">
            <h2 class="page-title">หน้าหลัก</h2>

            <!-- ➕ ปุ่มเพิ่มผลงานหลัก -->
            <button type="button" id="addPortfolioBtn" class="btn-add-portfolio">
                <i class="fa-solid fa-square-plus"></i>
                <span>เพิ่มผลงาน</span>
            </button>

            <!-- กล่องตัวเลือกประเภทการอัปโหลด -->
            <div id="uploadOptionsBox" class="upload-options-box" style="display: none;">
                <h3>เพิ่มผลงานเป็น</h3>
                
                <div class="option-item" data-type="file">
                    <div class="option-icon-wrapper">
                        <i class="fa-solid fa-paperclip"></i>
                    </div>
                    <span>ไฟล์</span>
                </div>

                <div class="option-item" data-type="link">
                    <div class="option-icon-wrapper">
                        <i class="fa-solid fa-link"></i>
                    </div>
                    <span>ลิงก์</span>
                </div>
            </div>

            <!-- 🔍 ส่วนค้นหาและตัวกรองผลงาน -->
            <div id="filterSection" class="filter-section">
                <div class="search-box-wrapper">
                    <input type="text" id="searchPortfolioInput" placeholder=" ค้นหาชื่อผลงาน..." class="search-input">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                </div>
                
                <div class="filter-tabs-wrapper">
                    <button type="button" class="filter-tab-btn active" data-filter="all">ทั้งหมด</button>
                    <button type="button" class="filter-tab-btn" data-filter="file">ไฟล์</button>
                    <button type="button" class="filter-tab-btn" data-filter="link">ลิงก์</button>
                </div>
            </div>

            <div id="portfolioContainer" class="portfolio-container"></div>
        </main>
    </div>

    <!-- ➕ ปุ่มบวกลอยตัว -->
    <button type="button" id="floatingAddBtn" class="floating-add-btn" title="เพิ่มอย่างรวดเร็ว">
        <i class="fa-solid fa-plus"></i>
    </button>

    <input type="file" id="fileInputHidden" style="display: none;" accept="image/*, application/pdf">
    
    <!-- Modal พรีวิวผลงาน -->
    <div id="previewModal" class="preview-modal" style="display: none;">
        <div class="modal-controls">
            <a id="modalDownloadBtn" href="#" download="" class="modal-btn download-btn" title="ดาวน์โหลดไฟล์นี้ลงเครื่อง">
                <i class="fa-solid fa-download"></i>
            </a>
            <button id="closeModalBtn" class="modal-btn close-btn" title="ปิดหน้าต่าง">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div id="modalContentArea" class="modal-content-area"></div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
