<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hello U - ประวัติผลงาน</title>
    <!-- Favicon & Stylesheets (ใช้ main.css และ FontAwesome แบบเดียวกับหน้าหลัก) -->
    <link rel="icon" type="image/png" href="https://cdn.phototourl.com/free/2026-07-02-bf2530e4-cb2e-459f-93de-d59034eb5c2c.png">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js สำหรับกราฟสถิติ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="main-page">

    <!-- ⬛ ฉากหลังโปร่งแสงสำหรับมือถือ -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div class="dashboard-wrapper">
        
        <!-- 🧭 แท็บเมนูด้านข้าง (Sidebar Menu เหมือนหน้า main.html) -->
        <aside id="sidebar" class="sidebar">
            <button type="button" id="menuToggleBtn" class="arrow-toggle-btn" title="เปิด/ปิด เมนู" aria-label="Toggle Navigation">
                <i id="toggleIcon" class="fa-solid fa-chevron-left"></i>
            </button>

            <div>
                <!-- โลโก้แบรนด์ -->
                <div class="sidebar-brand">
                    <img src="https://cdn.phototourl.com/free/2026-07-02-bf2530e4-cb2e-459f-93de-d59034eb5c2c.png" alt="Hello U Logo" class="brand-icon" style="width: 32px; height: 32px; object-fit: contain;">
                    <span class="brand-text">Hello U</span>
                </div>
                
                <!-- 📂 แท็บเมนูหลัก (ไฮไลท์ active ที่ประวัติผลงาน) -->
                <nav class="sidebar-menu">
                    <a href="main.html" class="menu-item">
                        <i class="fa-solid fa-house"></i>
                        <span class="menu-text">หน้าหลัก</span>
                    </a>
                    <a href="history.html" class="menu-item active">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                        <span class="menu-text">ประวัติผลงาน</span>
                    </a>
                </nav>
            </div>

            <!-- ส่วนข้อมูลผู้ใช้และปุ่มตั้งค่าด้านล่าง -->
            <div class="sidebar-footer">
                <div class="user-info-box">
                    <div class="avatar-box">
                        <img id="userAvatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=HelloU" alt="User Avatar">
                    </div>
                    <div class="user-meta">
                        <p id="userNameDisplay">กำลังโหลด...</p>
                        <p id="portfolioCountDisplay">จำนวนผลงาน: 0 ชิ้น</p>
                    </div>
                </div>
                
                <button type="button" id="settingsBtn" class="settings-btn" title="ตั้งค่าโปรไฟล์">
                    <i class="fa-solid fa-gear"></i>
                    <span class="menu-text">ตั้งค่าโปรไฟล์</span>
                </button>
            </div>
        </aside>

        <!-- 📄 เนื้อหาหลักฝั่งขวา (ประวัติและสถิติ) -->
        <main class="main-content">
            <h2 class="page-title">ประวัติผลงาน</h2>

            <!-- 📊 ส่วนแสดงสถิติภาพรวม -->
            <div class="stats-overview-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px;">
                <div class="stat-info-card" style="background: rgba(255, 255, 255, 0.05); padding: 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; gap: 12px;">
                    <div style="width: 40px; height: 40px; border-radius: 10px; background: rgba(56, 189, 248, 0.2); color: #38bdf8; display: flex; align-items: center; justify-content: center; font-size: 18px;">
                        <i class="fa-solid fa-folder-open"></i>
                    </div>
                    <div>
                        <span style="font-size: 12px; opacity: 0.7; display: block;">ผลงานทั้งหมด</span>
                        <strong id="statTotalItems" style="font-size: 18px;">0 ชิ้น</strong>
                    </div>
                </div>

                <div class="stat-info-card" style="background: rgba(255, 255, 255, 0.05); padding: 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; gap: 12px;">
                    <div style="width: 40px; height: 40px; border-radius: 10px; background: rgba(52, 211, 153, 0.2); color: #34d399; display: flex; align-items: center; justify-content: center; font-size: 18px;">
                        <i class="fa-solid fa-clock"></i>
                    </div>
                    <div>
                        <span style="font-size: 12px; opacity: 0.7; display: block;">อัปโหลดล่าสุด</span>
                        <strong id="statLastUpdated" style="font-size: 13px;">-</strong>
                    </div>
                </div>
            </div>

            <!-- 🍩 กราฟแสดงสัดส่วน -->
            <div class="charts-overview-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px;">
                <div class="chart-box-card" style="background: rgba(255, 255, 255, 0.05); padding: 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center;">
                    <h3 style="font-size: 14px; margin-bottom: 12px; opacity: 0.9;">สัดส่วนประเภทผลงาน (%)</h3>
                    <div style="position: relative; width: 100%; max-width: 180px; margin: 0 auto;">
                        <canvas id="typeDistributionChart"></canvas>
                    </div>
                </div>

                <div class="chart-box-card" style="background: rgba(255, 255, 255, 0.05); padding: 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center;">
                    <h3 style="font-size: 14px; margin-bottom: 12px; opacity: 0.9;">พื้นที่จัดเก็บที่ใช้ไป</h3>
                    <div style="position: relative; width: 100%; max-width: 180px; margin: 0 auto;">
                        <canvas id="storageUsageChart"></canvas>
                    </div>
                    <p id="storageTextDetails" style="font-size: 12px; opacity: 0.7; margin-top: 10px;">ใช้ไป 0 KB / โควต้า 10 MB</p>
                </div>
            </div>

            <!-- 🔍 ตัวกรองแท็บประเภทผลงาน -->
            <div id="filterSection" class="filter-section" style="margin-bottom: 16px;">
                <div class="filter-tabs-wrapper">
                    <button type="button" class="filter-tab-btn active" data-filter="all">ทั้งหมด</button>
                    <button type="button" class="filter-tab-btn" data-filter="file">ไฟล์</button>
                    <button type="button" class="filter-tab-btn" data-filter="link">ลิงก์</button>
                </div>
            </div>

            <!-- 📋 รายการประวัติผลงาน -->
            <div id="historyContainer" class="history-list-container"></div>
        </main>
    </div>

    <script type="module" src="history.js"></script>
</body>
</html>
